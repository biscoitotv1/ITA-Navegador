<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITA Browser - Home</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #000000;
  color: #ffffff;
  overflow: hidden;
}
#home {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  background: #000000;
}
.logo {
  font-size: 56px;
  font-weight: 800;
  letter-spacing: 2px;
  background: linear-gradient(90deg, #ff6a00, #ffa14d);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
}
.subtitle {
  font-size: 18px;
  color: #9aa3b2;
  margin-bottom: 40px;
  letter-spacing: 1px;
}
.search-form {
  display: flex;
  gap: 10px;
  width: 700px;
  max-width: 90%;
}
.search-form input {
  flex: 1;
  padding: 14px 18px;
  border-radius: 999px;
  border: 1px solid #1f1f1f;
  background: #0a0a0a;
  color: #e0e0e0;
  font-size: 16px;
  outline: none;
}
.search-form input:focus {
  border-color: #ff6a00;
  box-shadow: 0 0 0 2px rgba(255, 106, 0, .35);
}
.search-form button {
  padding: 14px 20px;
  border-radius: 999px;
  border: none;
  background: linear-gradient(135deg, #ff6a00, #e35200);
  color: #fff;
  font-weight: 600;
  cursor: pointer;
}
.search-form button:hover {
  background: #e35200;
  transform: translateY(-1px);
}
.shortcuts {
  display: flex;
  gap: 16px;
  margin-top: 40px;
  flex-wrap: wrap;
  justify-content: center;
}
.shortcut {
  width: 110px;
  height: 110px;
  border-radius: 18px;
  background: #0a0a0a;
  border: 1px solid #1f1f1f;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all .2s;
}
.shortcut:hover {
  transform: translateY(-3px);
  border-color: #ff6a00;
  box-shadow: 0 10px 30px rgba(255, 106, 0, .35);
}
.shortcut-icon {
  font-size: 28px;
  margin-bottom: 8px;
}
.shortcut-title {
  font-size: 12px;
  color: #d4d4d4;
  text-align: center;
  padding: 0 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
</style>
</head>
<body>
<div id="home">
  <div class="logo">ITA Browser</div>
  <div class="subtitle">ITA Games Studios</div>
  <form class="search-form" id="searchForm">
    <input type="text" id="searchInput" placeholder="Pesquisar ou digitar URL..." />
    <button type="submit">Pesquisar</button>
  </form>
  <div class="shortcuts">
    <div class="shortcut" data-url="https://itabrowser.top">
      <div class="shortcut-icon">&#128293;</div>
      <div class="shortcut-title">ITA Cloud</div>
    </div>
    <div class="shortcut" data-url="https://www.google.com">
      <div class="shortcut-icon">&#128269;</div>
      <div class="shortcut-title">Google</div>
    </div>
    <div class="shortcut" data-url="https://www.youtube.com">
      <div class="shortcut-icon">&#9654;</div>
      <div class="shortcut-title">YouTube</div>
    </div>
    <div class="shortcut" data-url="https://www.instagram.com">
      <div class="shortcut-icon">&#128247;</div>
      <div class="shortcut-title">Instagram</div>
    </div>
    <div class="shortcut" data-url="https://www.twitch.tv">
      <div class="shortcut-icon">&#127918;</div>
      <div class="shortcut-title">Twitch</div>
    </div>
    <div class="shortcut" data-url="https://store.steampowered.com">
      <div class="shortcut-icon">&#127918;</div>
      <div class="shortcut-title">Steam</div>
    </div>
    <div class="shortcut" data-url="https://www.reddit.com">
      <div class="shortcut-icon">&#128420;</div>
      <div class="shortcut-title">Reddit</div>
    </div>
    <div class="shortcut" data-url="https://www.github.com">
      <div class="shortcut-icon">&#128187;</div>
      <div class="shortcut-title">GitHub</div>
    </div>
  </div>
</div>

<script>
  const searchForm = document.getElementById('searchForm')
  const searchInput = document.getElementById('searchInput')

  searchForm.addEventListener('submit', (e) => {
    e.preventDefault()
    const query = searchInput.value.trim()
    if (query && window.parent) {
      const ui = window.parent.itaUI || window.parent.itaBrowser
      if (ui && ui.navigate) ui.navigate(query)
    }
  })

  document.querySelectorAll('.shortcut').forEach(btn => {
    btn.addEventListener('click', () => {
      const url = btn.dataset.url
      if (url && window.parent) {
        const ui = window.parent.itaUI || window.parent.itaBrowser
        if (ui && ui.navigate) ui.navigate(url)
      }
    })
  })
</script>
</body>
</html>
