<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0a0f1c">
    <title>ITA Navegador</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="128x128" href="/brand/ita-logo-128.png">
    <link rel="icon" type="image/x-icon" href="/brand/ita-logo.ico">
    <link rel="apple-touch-icon" href="/brand/ita-logo.png">
    <link rel="stylesheet" href="/ui/ita-ui.css">
</head>

<body>
    <div class="ita-shell" id="itaShell">

        <!-- ==================================================
             BARRA DE TÍTULOS (arrastável; botões nativos ficam
             no overlay do Electron — espaço reservado à direita)
             ================================================== -->
        <header class="ita-titlebar" id="itaTitlebar">
            <div class="brand">
                <img class="brand-mark" src="/brand/ita-logo-128.png" alt="ITA Navegador" draggable="false">
                <span class="brand-name">ITA <b>Navegador</b></span>
            </div>
            <div class="titlebar-drag"></div>
            <span class="titlebar-tag" id="titlebarStatus">NAVEGAÇÃO PROTEGIDA • PROXY INTERNO</span>
            <div class="titlebar-overlay-space" aria-hidden="true"></div>
        </header>

        <!-- ==================================================
             ABAS
             ================================================== -->
        <nav class="tabs-bar" id="tabsBar" role="tablist" aria-label="Abas abertas">
            <div class="tabs-scroll" id="tabsScroll"></div>
            <button class="icon-btn newtab-btn" id="newTabBtn" type="button" title="Nova aba (Ctrl+T)" aria-label="Nova aba">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
        </nav>

        <!-- ==================================================
             BARRA DE NAVEGAÇÃO
             ================================================== -->
        <header class="navbar" id="navbar">
            <div class="nav-group">
                <button class="icon-btn nav-btn" id="backBtn" type="button" title="Voltar (Alt+←)" disabled
                    aria-label="Voltar">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <button class="icon-btn nav-btn" id="fwdBtn" type="button" title="Avançar (Alt+→)" disabled
                    aria-label="Avançar">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <button class="icon-btn nav-btn" id="reloadBtn" type="button" title="Recarregar" disabled
                    aria-label="Recarregar">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                        <path d="M20 3v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
                <button class="icon-btn nav-btn" id="homeBtn" type="button" title="Página inicial"
                    aria-label="Página inicial">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 10.5L12 3l9 7.5" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M5.5 9.5V21h13V9.5" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
            </div>

            <!-- Campo de endereço limpo, com indicador de segurança -->
            <form class="omnibox" id="omniboxForm" role="search" autocomplete="off">
                <span class="omni-lock internal" id="omniLock" title="Segurança da conexão" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor"
                            stroke-width="2" />
                        <path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                </span>
                <input id="urlInput" type="text" placeholder="Pesquise ou digite um endereço…" autocomplete="off"
                    spellcheck="false" aria-label="Endereço ou pesquisa">
                <button class="icon-btn omni-star" id="starBtn" type="button" title="Favoritar (Ctrl+D)"
                    aria-label="Favoritar página">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.2-4.1 5.8-.8z"
                            fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                    </svg>
                </button>
            </form>

            <div class="nav-group">
                <button class="icon-btn" id="downloadsBtn" type="button" title="Downloads" aria-label="Downloads">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 3v12M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M4 19h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <span class="badge" id="downloadsBadge" hidden>0</span>
                </button>
            </div>
        </header>

        <!-- ==================================================
             ÁREA DE CONTEÚDO (um webview por aba + página inicial)
             ================================================== -->
        <main class="viewport" id="viewport">
            <div class="load-progress" id="loadProgress" aria-hidden="true">
                <div class="bar"></div>
            </div>

            <!-- Página de nova aba: busca + atalhos -->
            <section class="newtab" id="newTabPage">
                <img class="newtab-logo-img" src="/brand/ita-logo-256.png" alt="" width="84" height="84" draggable="false">
                <h1 class="newtab-logo">ITA Navegador</h1>
                <p class="newtab-sub">ITA Games Studios</p>
                <span class="newtab-season-chip" id="newTabSeason" hidden></span>

                <form class="newtab-search" id="newTabSearch">
                    <input id="newTabInput" type="text" placeholder="Pesquise na web ou digite uma URL…"
                        autocomplete="off" spellcheck="false" aria-label="Pesquisar ou digitar URL">
                    <button type="submit">Navegar</button>
                </form>

                <div class="shortcuts" aria-label="Atalhos rápidos">
                    <button class="shortcut" type="button" data-url="https://www.youtube.com">
                        <span class="shortcut-icon">▶</span>
                        <span class="shortcut-name">YouTube</span>
                    </button>
                    <button class="shortcut" type="button" data-url="https://www.twitch.tv">
                        <span class="shortcut-icon">🎮</span>
                        <span class="shortcut-name">Twitch</span>
                    </button>
                    <button class="shortcut" type="button" data-url="https://store.steampowered.com">
                        <span class="shortcut-icon">🕹</span>
                        <span class="shortcut-name">Steam</span>
                    </button>
                    <button class="shortcut" type="button" data-url="https://www.reddit.com">
                        <span class="shortcut-icon">👽</span>
                        <span class="shortcut-name">Reddit</span>
                    </button>
                    <button class="shortcut" type="button" data-url="https://github.com">
                        <span class="shortcut-icon">💻</span>
                        <span class="shortcut-name">GitHub</span>
                    </button>
                    <button class="shortcut" type="button" data-url="/ide">
                        <span class="shortcut-icon">⚡</span>
                        <span class="shortcut-name">IDE</span>
                    </button>
                    <button class="shortcut" type="button" data-url="https://itabrowser.top">
                        <span class="shortcut-icon">🚀</span>
                        <span class="shortcut-name">ITA Games</span>
                    </button>
                </div>
            </section>
        </main>

        <!-- ==================================================
             BARRA DE STATUS
             ================================================== -->
        <footer class="statusbar">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Iniciando…</span>
            <span class="status-right" id="serverTag">ITA Local Server</span>
        </footer>
    </div>

    <!-- ==================================================
         PAINEL DE DOWNLOADS
         ================================================== -->
    <aside class="downloads-panel" id="downloadsPanel" aria-label="Downloads">
        <div class="dl-head">
            <span>Downloads</span>
            <button class="icon-btn" id="downloadsClose" type="button" title="Fechar" aria-label="Fechar painel de downloads">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" />
                </svg>
            </button>
        </div>
        <div class="dl-list" id="downloadsList"></div>
    </aside>

    <!-- ==================================================
         TOAST DE SEGURANÇA / NOTIFICAÇÕES
         ================================================== -->
    <div class="toast" id="toast" role="alert"></div>

    <script src="/ui/ita-ui.js"></script>
    <script>
        // PWA: registra o Service Worker apenas no site (HTTPS).
        // No app desktop (Electron/localhost) é ignorado — a UI já é local.
        if ('serviceWorker' in navigator && location.protocol === 'https:') {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js').catch(function () {})
            })
        }
    </script>
</body>

</html>
