<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0a0f1c">
    <title>Sem conexão — ITA Navegador</title>
    <link rel="icon" type="image/png" sizes="128x128" href="/brand/ita-logo-128.png">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; margin: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(900px 420px at 50% -10%, rgba(42, 82, 152, .28), transparent 60%),
                radial-gradient(700px 380px at 85% 110%, rgba(36, 229, 138, .10), transparent 60%),
                #060a13;
            color: #e8eefc;
            text-align: center;
            padding: 24px;
        }
        .card { max-width: 480px; }
        img {
            width: 84px;
            height: 84px;
            object-fit: contain;
            filter: drop-shadow(0 12px 34px rgba(42, 82, 152, .55));
        }
        h1 { font-size: 28px; margin: 18px 0 8px; }
        h1 b { color: #24e58a; }
        p { color: #9fb0d0; line-height: 1.6; margin-bottom: 22px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #24e58a, #14b8a6);
            color: #04121f;
            font-weight: 700;
            border: 0;
            border-radius: 999px;
            padding: 12px 26px;
            cursor: pointer;
            font-size: 15px;
        }
        .btn:hover { filter: brightness(1.08); }
        .hint { margin-top: 16px; margin-bottom: 0; font-size: 12.5px; color: #63759a; }
    </style>
</head>

<body>
    <main class="card">
        <img src="/brand/ita-logo-128.png" alt="ITA Navegador">
        <h1>Você está <b>offline</b></h1>
        <p>Sem conexão com a internet agora. Suas abas, favoritos e a interface do ITA Navegador continuam salvos — a
            navegação volta assim que a conexão retornar.</p>
        <button class="btn" type="button" onclick="location.reload()">↻ Tentar novamente</button>
        <p class="hint">Esta página é recarregada automaticamente quando a conexão é restabelecida.</p>
    </main>
    <script>window.addEventListener('online', function () { location.reload() })</script>
</body>

</html>
