<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0a0f1c">
    <title>ITA IDE Workspace</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="128x128" href="/brand/ita-logo-128.png">
    <link rel="icon" type="image/x-icon" href="/brand/ita-logo.ico">
    <link rel="apple-touch-icon" href="/brand/ita-logo.png">
    <link rel="preload" href="/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/JetBrainsMono.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/fonts/fonts.css">
    <link rel="stylesheet" href="/ide/ita-ide.css">
</head>

<body>
    <!-- ==================================================
         BARRA SUPERIOR
         ================================================== -->
    <header class="topbar">
        <div class="brand">
            <img class="brand-mark" src="/brand/ita-logo-128.png" alt="ITA" draggable="false">
            <span class="brand-name">IDE Workspace<span class="brand-dot">.</span></span>
            <span class="brand-ver">v1.0</span>
        </div>
        <nav class="top-nav">
            <a class="chip chip-green" href="/app">← Voltar ao Navegador</a>
        </nav>
    </header>

    <div class="workspace">
        <!-- ==================================================
             PAINEL DA ESQUERDA: IDE
             ================================================== -->
        <section class="ide-pane" aria-label="Editor de código">
            <div class="pane-header">
                <span class="pane-title">⚡ Editor</span>
                <div class="pane-actions">
                    <button id="clearConsoleBtn" class="btn-mini" type="button">Limpar console</button>
                    <button id="runBtn" class="btn-run" type="button">▶ Executar <span class="kbd">Ctrl+↵</span></button>
                </div>
            </div>
            <textarea id="editor" class="editor-area" spellcheck="false" autocomplete="off"
                aria-label="Editor de scripts">// Escreva seus scripts e clique em Executar (Ctrl+Enter)…
function iniciarITA() {
  const msg = "Ambiente ITA IDE carregado com sucesso.";
  console.log(msg);
  return msg;
}

iniciarITA();
console.table({ app: "ITA Navegador", modulo: "IDE Workspace", versao: "1.0" });</textarea>
            <div class="console-pane">
                <div class="console-head">
                    <span>Console</span>
                    <span id="consoleCount">0 mensagens</span>
                </div>
                <div class="console-out" id="consoleOut" aria-live="polite"></div>
            </div>
        </section>

        <!-- ==================================================
             PAINEL DA DIREITA: NAVEGADOR
             ================================================== -->
        <section class="browser-pane" aria-label="Navegador">
            <div class="browser-toolbar">
                <button id="backBtn" class="nav-btn" type="button" title="Voltar" aria-label="Voltar" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <button id="fwdBtn" class="nav-btn" type="button" title="Avançar" aria-label="Avançar" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <button id="reloadBtn" class="nav-btn" type="button" title="Recarregar" aria-label="Recarregar">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20 11a8 8 0 1 0-2.3 6.3M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <button id="homeBtn" class="nav-btn" type="button" title="Página inicial" aria-label="Página inicial">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <div class="url-wrap">
                    <span id="lockIcon" class="lock" title=""></span>
                    <input id="urlInput" class="url-bar" type="text" placeholder="Pesquise ou digite um endereço…"
                        autocomplete="off" spellcheck="false" aria-label="Endereço">
                </div>
                <button id="goBtn" class="btn-go" type="button">Acessar</button>
            </div>

            <div class="browser-stage">
                <div class="home-screen" id="homeScreen">
                    <h2>Navegador do Workspace</h2>
                    <p>Use a barra de endereço acima ou comece por um atalho:</p>
                    <div class="quick-links">
                        <button type="button" data-url="https://www.wikipedia.org">🌍 Wikipedia</button>
                        <button type="button" data-url="https://www.openstreetmap.org">🗺️ OpenStreetMap</button>
                        <button type="button" data-url="https://example.com">📄 example.com</button>
                        <button type="button" data-url="https://itabrowser.top">🚀 ITA Games</button>
                    </div>
                    <p class="home-hint" id="modeHint"></p>
                </div>
                <iframe id="browserFrame" class="browser-frame" title="Viewport do navegador"></iframe>
            </div>

            <div class="browser-status">
                <span id="modeChip" class="chip">Verificando proxy…</span>
                <span id="pageState">Página inicial</span>
            </div>
        </section>
    </div>

    <script src="/ide/ita-ide.js"></script>
    <script>
        // PWA: registra o Service Worker apenas no site (HTTPS).
        if ('serviceWorker' in navigator && location.protocol === 'https:') {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js').catch(function () {})
            })
        }
    </script>
</body>

</html>
